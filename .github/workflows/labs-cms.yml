name: Viora Labs CMS tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/admin-labs-manager, feature/admin-dashboard-overhaul, feature/personal-intelligence]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: |
          node --check server.js
          node --check labs-cms.js
      - name: Run backend test suite
        run: npm test
