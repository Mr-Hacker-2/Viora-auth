name: Viora auth tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/viora-settings-upgrade]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server.js
      - name: Run auth test suite
        run: npm test
